name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Refuse a bad tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy
      - run: scripts/check.sh
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:$VERSION"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" -t "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - run: scripts/smoke.sh "$IMAGE"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Immutable per version: never overwrite a published tag.
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE already published; not pushing again"
          else
            docker push "$IMAGE"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          echo "published $IMAGE@$digest"
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --verify-tag --title "$VERSION" --notes "Image: \`$IMAGE@$digest\`"
